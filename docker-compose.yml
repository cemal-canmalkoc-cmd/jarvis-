# Jarvis + automatisches HTTPS (Caddy). Läuft kostenlos z.B. auf Oracle Cloud "Always Free".
# Start:  docker compose up -d
services:
  jarvis:
    build: .
    env_file: .env
    volumes:
      - jarvis-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - JARVIS_DOMAIN=${JARVIS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - jarvis
    restart: unless-stopped

volumes:
  jarvis-data:
  caddy-data:
